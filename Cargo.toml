[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Stremkoz/transmute"
publish = false

[workspace.dependencies]
transmute-core = { path = "crates/transmute-core" }
transmute-backends = { path = "crates/transmute-backends" }
transmute-engine = { path = "crates/transmute-engine" }
transmute-api = { path = "crates/transmute-api" }

brotli-decompressor = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
process-wrap = { version = "8", features = ["tokio1", "creation-flags", "job-object", "process-group", "kill-on-drop"] }
miniz_oxide = "0.8"
proptest = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
# The desktop shell (src-tauri). The asset protocol serves previews to the webview.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = "2"
ssimulacra2 = "0.5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs", "signal"] }
tokio-util = "0.7"
# Must match the version process-wrap uses, so CreationFlags takes our flag type.
windows = { version = "0.61", features = ["Win32_System_Threading"] }
thiserror = "2"
tracing = "0.1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
