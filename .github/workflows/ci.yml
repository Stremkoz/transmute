name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform; Ubuntu is cheaper and keeps the core portable.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned version and components.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Skips its steps until package.json exists, so CI stays green before the
  # Tauri frontend is scaffolded.
  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: node
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package.json yet; skipping frontend checks."
          fi

      - uses: actions/setup-node@v4
        if: steps.node.outputs.present
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        if: steps.node.outputs.present
        run: npm ci

      - name: Lint
        if: steps.node.outputs.present
        run: npm run lint --if-present

      - name: Type check
        if: steps.node.outputs.present
        run: npm run typecheck --if-present

      - name: Test
        if: steps.node.outputs.present
        run: npm test --if-present

      - name: Build
        if: steps.node.outputs.present
        run: npm run build --if-present
