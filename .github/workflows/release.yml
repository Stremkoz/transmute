name: Release

# A `v*` tag builds the Windows downloads (installer + portable zip, with the
# bundled tools) and attaches them to a draft release for review. Running it
# by hand builds the same files as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows downloads
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: npm ci

      # Fetches the pinned, hash-checked tools, builds the app, the NSIS
      # installer and the portable zip.
      - name: Package
        run: python scripts/package.py

      - uses: actions/upload-artifact@v7
        with:
          name: transmute-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/portable/*.zip
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
            target/release/bundle/nsis/*-setup.exe \
            target/release/bundle/portable/*.zip
