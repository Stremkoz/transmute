name: Bug report
description: Something converted wrongly, failed, or behaved unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add folder containing ...
        2. Enable output ...
        3. Click Convert
    validations:
      required: true
  - type: input
    id: formats
    attributes:
      label: Input and output formats
      placeholder: e.g. .heic → .jxl (distance 1.0)
  - type: input
    id: version
    attributes:
      label: Transmute version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: Error report or technical log
      description: Paste the exported error report or the relevant log lines.
      render: text
